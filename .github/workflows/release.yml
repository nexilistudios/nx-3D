name: Game release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version; blank increments the patch version"
        required: false
        type: string
      update_flake_lock:
        description: 'Update flake.lock (nix flake update) and verify the Nix build before releasing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: game-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          current = Path('VERSION.txt').read_text().strip()
          requested = os.environ['REQUESTED_VERSION']
          pattern = r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          def parts(value):
              match = re.fullmatch(pattern, value)
              if not match:
                  raise SystemExit(f'Invalid version {value!r}; expected MAJOR.MINOR.PATCH')
              return tuple(map(int, match.groups()))

          major, minor, patch = parts(current)
          version = requested or f'{major}.{minor}.{patch + 1}'
          if parts(version) <= (major, minor, patch):
              raise SystemExit(f'Release version {version} must be newer than {current}')
          print(version)
          PY
          )"
          git fetch --tags origin
          ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read pinned Nexilis commit
        id: nexilis
        run: echo "sha=$(git rev-parse HEAD:nexilis)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Nexilislib/nexilis
          ref: ${{ steps.nexilis.outputs.sha }}
          path: nexilis
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-json-dev libssl-dev libglm-dev patchelf
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install 'cmake>=3.30,<5'
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"
      - name: Build and test Linux server
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > VERSION.txt
          CI=1 cmake -S . -B build-release-linux -DCMAKE_BUILD_TYPE=Release \
            -DNX3D_BUILD_CLIENT=OFF
          cmake --build build-release-linux --parallel 4
          ctest --test-dir build-release-linux --output-on-failure
          python3 scripts/package_linux_server.py --build-dir build-release-linux
          test -s "dist/nx-3D-server-v${{ needs.prepare.outputs.version }}-linux-x64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: dist/nx-3D-server-v${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error

  linux_client:
    needs: prepare
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read pinned submodule commits
        id: submodules
        run: |
          echo "nexilis=$(git rev-parse HEAD:nexilis)" >> "$GITHUB_OUTPUT"
          echo "spear=$(git rev-parse HEAD:spear)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Nexilislib/nexilis
          ref: ${{ steps.submodules.outputs.nexilis }}
          path: nexilis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NeuronActivation/spear
          ref: ${{ steps.submodules.outputs.spear }}
          path: spear
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-json-dev libssl-dev libglm-dev patchelf \
            libvulkan-dev libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev \
            libglew-dev libbullet-dev libshaderc-dev \
            glslang-dev glslang-tools spirv-tools-dev pkg-config libgl-dev
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install 'cmake>=3.30,<5'
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"
      - name: Build SDL3 mixer
        run: |
          curl -fsSL https://github.com/libsdl-org/SDL_mixer/releases/download/release-3.2.4/SDL3_mixer-3.2.4.tar.gz \
            -o "$RUNNER_TEMP/SDL3_mixer-3.2.4.tar.gz"
          echo '182a07c745375e113dc740d43964ff21b0be29f29f59876c4dbc4db3d32f6901  '"$RUNNER_TEMP/SDL3_mixer-3.2.4.tar.gz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/SDL3_mixer-3.2.4.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL3_mixer-3.2.4" -B "$RUNNER_TEMP/sdl3-mixer-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3-mixer" \
            -DCMAKE_INSTALL_LIBDIR=lib -DSDLMIXER_TESTS=OFF -DSDLMIXER_EXAMPLES=OFF \
            -DSDLMIXER_GME=OFF -DSDLMIXER_MOD=OFF -DSDLMIXER_MIDI=OFF \
            -DSDLMIXER_OPUS=OFF -DSDLMIXER_WAVPACK=OFF \
            -DSDLMIXER_FLAC_LIBFLAC=OFF -DSDLMIXER_MP3_MPG123=OFF \
            -DSDLMIXER_VORBIS_VORBISFILE=OFF
          cmake --build "$RUNNER_TEMP/sdl3-mixer-build" --parallel 4
          cmake --install "$RUNNER_TEMP/sdl3-mixer-build"
      - name: Build and package Linux client
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > VERSION.txt
          export LD_LIBRARY_PATH="$RUNNER_TEMP/sdl3-mixer/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          CI=1 cmake -S . -B build-release-linux-client -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DNX3D_PORTABLE_CLIENT=ON \
            -DSDL3_mixer_DIR="$RUNNER_TEMP/sdl3-mixer/lib/cmake/SDL3_mixer"
          cmake --build build-release-linux-client --target nx_3D_client --parallel 4
          python3 scripts/package_linux_client.py --build-dir build-release-linux-client
          test -s "dist/nx-3D-client-v${RELEASE_VERSION}-linux-x64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: dist/nx-3D-client-v${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read pinned Nexilis commit
        id: nexilis
        run: echo "sha=$(git rev-parse HEAD:nexilis)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Nexilislib/nexilis
          ref: ${{ steps.nexilis.outputs.sha }}
          path: nexilis
          persist-credentials: false
      - name: Install cross compiler and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 libboost-json-dev perl zip unzip file
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install 'cmake>=3.30,<5'
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"
      - name: Build Windows server and bundle DLLs
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > VERSION.txt
          bash scripts/build_windows_server.sh
          test -s "dist/nx-3D-server-v${{ needs.prepare.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-server
          path: dist/nx-3D-server-v${{ needs.prepare.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  windows_client:
    needs: prepare
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read pinned submodule commits
        id: submodules
        shell: bash
        run: |
          echo "nexilis=$(git rev-parse HEAD:nexilis)" >> "$GITHUB_OUTPUT"
          echo "spear=$(git rev-parse HEAD:spear)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Nexilislib/nexilis
          ref: ${{ steps.submodules.outputs.nexilis }}
          path: nexilis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NeuronActivation/spear
          ref: ${{ steps.submodules.outputs.spear }}
          path: spear
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git python zip unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-image
            mingw-w64-ucrt-x86_64-sdl3-ttf
            mingw-w64-ucrt-x86_64-sdl3-mixer
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-bullet
            mingw-w64-ucrt-x86_64-glm
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-shaderc
      - name: Build and package Windows client
        shell: msys2 {0}
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > VERSION.txt
          CI=1 cmake -S . -B build-release-windows-client -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DNX3D_PORTABLE_CLIENT=ON
          cmake --build build-release-windows-client --target nx_3D_client --parallel 4
          bash scripts/package_windows_client.sh build-release-windows-client
          test -s "dist/nx-3D-client-v${{ needs.prepare.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: dist/nx-3D-client-v${{ needs.prepare.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  nix:
    needs: prepare
    if: inputs.update_flake_lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.RELEASE_READ_TOKEN || github.token }}
      - name: Update flake inputs (nixpkgs)
        run: nix flake update
      # The refreshed lock is only released if everything still builds with it.
      - name: Build all packages with the updated lock
        run: nix build --print-build-logs .#nexilis .#server .#client
      - name: Check flake
        run: nix flake check --no-build --all-systems
      - uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error

  publish:
    needs: [prepare, linux, linux_client, windows, windows_client, nix]
    # The nix job is skipped when update_flake_lock is off.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-{server,client}'
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        if: needs.nix.result == 'success'
        with:
          name: flake-lock
          path: .
      - name: Check all release archives
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -s "release-assets/nx-3D-server-v${RELEASE_VERSION}-linux-x64.tar.gz"
          test -s "release-assets/nx-3D-server-v${RELEASE_VERSION}-windows-x64.zip"
          test -s "release-assets/nx-3D-client-v${RELEASE_VERSION}-linux-x64.tar.gz"
          test -s "release-assets/nx-3D-client-v${RELEASE_VERSION}-windows-x64.zip"
          tar -tzf "release-assets/nx-3D-server-v${RELEASE_VERSION}-linux-x64.tar.gz" | grep -q nx-3D-server
          tar -tzf "release-assets/nx-3D-client-v${RELEASE_VERSION}-linux-x64.tar.gz" | grep -q nx_3D_client
          unzip -t "release-assets/nx-3D-server-v${RELEASE_VERSION}-windows-x64.zip" | tail -1
          unzip -t "release-assets/nx-3D-client-v${RELEASE_VERSION}-windows-x64.zip" | tail -1
      - name: Commit version and tag after successful builds
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          current = Path('VERSION.txt').read_text().strip()
          version = os.environ['RELEASE_VERSION']
          flake_path = Path('flake.nix')
          flake = flake_path.read_text()
          old = f'version = "{current}";'
          if flake.count(old) != 3:
              raise SystemExit(f'Expected three flake.nix version fields matching {current}')
          flake_path.write_text(flake.replace(old, f'version = "{version}";'))
          Path('VERSION.txt').write_text(version + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION.txt flake.nix
          # Present only when the nix job refreshed and verified the lock.
          if [[ "${{ needs.nix.result }}" == 'success' ]]; then
            git add flake.lock
          fi
          git commit -m "Release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "nx-3D $RELEASE_TAG"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG"
      - name: Archive release source
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git archive --format=tar.gz --prefix="nx-3D-v${RELEASE_VERSION}/" \
            --output="release-assets/nx-3D-source-v${RELEASE_VERSION}.tar.gz" HEAD
          test -s "release-assets/nx-3D-source-v${RELEASE_VERSION}.tar.gz"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
            --title "nx-3D $RELEASE_VERSION" --generate-notes
