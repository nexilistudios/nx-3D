name: Nix

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'server/**'
      - 'client/**'
      - 'shared/**'
      - 'tests/**'
      - 'assets/**'
      - 'nexilis'
      - 'spear'
      - '.github/workflows/nix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # The flake fetches nexilis and spear itself, so no submodule checkout.
      - uses: actions/checkout@v4
      - name: Check that the flake pins the submodule commits
        run: |
          status=0
          for input in nexilis spear; do
            submodule="$(git rev-parse "HEAD:$input")"
            locked="$(jq -r ".nodes.$input.locked.rev" flake.lock)"
            if [ "$submodule" != "$locked" ]; then
              echo "::error file=flake.nix::flake.lock pins $input to $locked, but the submodule is at $submodule. Set that rev in the $input URL in flake.nix and run 'nix flake lock'."
              status=1
            fi
          done
          exit "$status"
      - uses: cachix/install-nix-action@v31
      # Builds the server (running its tests), the client and the NixOS VM test.
      - run: nix flake check --print-build-logs
      - run: nix flake check --no-build --all-systems
      - run: nix develop --command true
